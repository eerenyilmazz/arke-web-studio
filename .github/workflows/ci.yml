# Every push and pull request: lint, type check, build and the test suite (the browser end-to-end tests are left out:
# they need a desktop browser; run them locally with npm run test:e2e).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: for t in templates/*/; do [ -f "$t/package.json" ] && (cd "$t" && npm ci --no-fund --no-audit); done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          ARKE_E2E: "off"
