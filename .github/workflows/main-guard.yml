# main is the owner's branch. GitHub only enforces branch rules on private personal repositories with a paid plan,
# so this job does it after the fact: a push to main by anyone else is moved to a branch named
# geri-alinan/<user>-<run> (nothing is lost) and main is put back where it was. The owner then merges it if wanted.
# Collaborators work on their own branches. Limits: it acts seconds after the push, and someone who edits this file
# in the same push can switch it off, so it guards against mistakes, not against a determined collaborator.
name: main koruması
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: main-guard
  cancel-in-progress: false
jobs:
  guard:
    if: github.actor != 'eerenyilmazz'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep the push on its own branch, put main back
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          keep="geri-alinan/${ACTOR}-${GITHUB_RUN_ID}"
          git push origin "${AFTER}:refs/heads/${keep}"
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "main was created by ${ACTOR}; kept as ${keep}. Restore main by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --force origin "${BEFORE}:refs/heads/main"
          echo "Push to main by ${ACTOR} moved to ${keep}; main is back at ${BEFORE}." >> "$GITHUB_STEP_SUMMARY"
          exit 1
