<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Factory</title>
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
  <script>
    // Theme before first paint: the saved choice, else dark (ArkeLab's charcoal workbench).
    try {
      document.documentElement.dataset.theme = localStorage.getItem("sf-theme") || "dark";
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect class="floor f3" x="7" y="4" width="10" height="4" rx="1.2"/><rect class="floor f2" x="5" y="9.5" width="14" height="4" rx="1.2"/><rect class="floor f1" x="3" y="15" width="18" height="4" rx="1.2"/><rect class="axis" x="2" y="20.5" width="20" height="1.4" rx=".7"/></svg>
      </span>
      <span>Site Factory</span>
    </a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Müşteri ara" aria-label="Müşteri ara" autocomplete="off" />
    </label>
    <div class="topbar-right">
      <span id="agent-status" class="status-pill idle"><span class="dot"></span><span class="label">Sistem hazır</span></span>
      <button id="theme" class="icon-btn" type="button" aria-label="Temayı değiştir">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <a class="btn btn-primary btn-block" href="#/yeni">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Yeni Müşteri
      </a>
      <nav class="main-nav" aria-label="Ana menü">
        <a href="#/" data-nav="home">Müşteriler</a>
        <a href="#/analiz" data-nav="analytics">Analiz</a>
        <a href="#/kutuphane" data-nav="library">Tasarım Kütüphanesi</a>
        <a href="#/arsiv" data-nav="archive">Arşiv</a>
        <a href="#/ayarlar" data-nav="settings">Ayarlar</a>
      </nav>
      <nav id="clients" aria-label="Müşteriler" class="client-nav"></nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
